<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3452">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حساب کارگاه">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>حساب کارگاه</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><div style="padding:60px 20px;text-align:center;color:#64748B;font-family:Tahoma,sans-serif">در حال بارگذاری…</div></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
window.__showErr=function(m){var a=document.getElementById('app');if(!a||a.querySelector('header'))return;a.innerHTML='<div style="padding:18px;font:14px Tahoma,sans-serif;direction:rtl;line-height:1.9"><b>برنامه باز نشد.</b><br>این متن را به سازنده بفرست:<div style="direction:ltr;text-align:left;font:12px monospace;background:#fff;border:1px solid #ccc;padding:8px;margin-top:8px;word-break:break-all">'+String(m).replace(/</g,'&lt;')+'</div></div>';};
window.addEventListener('error',function(e){window.__showErr((e.message||'error')+' @ '+(e.filename||'').split('/').pop()+':'+(e.lineno||''));});
setTimeout(function(){var a=document.getElementById('app');if(a&&!window.__mainReady&&!a.querySelector('header')){a.innerHTML='<div style="padding:18px;font:14px Tahoma,sans-serif;direction:rtl;line-height:1.9"><b>برنامه هنوز بالا نیامده است.</b><br>اطلاعات شما روی گوشی سالم است.<br><a href="debug.html" style="color:#2B4F7A;font-weight:bold">ابزار عیب‌یابی و ذخیرهٔ پشتیبان ←</a><br><a href="index.html?safe=1" style="color:#2B4F7A">باز کردن در حالت امن ←</a><div style="direction:ltr;text-align:left;font:12px monospace;margin-top:8px">ready='+window.__mainReady+' extra='+typeof window.kargahExtra+'</div></div>';}},6000);
</script>
<script src="ideas.js" defer></script>
<script src="extra.js" defer></script>
<script src="app.js"></script>
<script src="app2.js"></script>
</body>
</html>
